server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: industry-risk-assessment-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.industryriskassessmentserver.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

file:
  upload:
    base-path: ${chain.datasets-path}
    max-size: 52428800

model:
  storage:
    base-path: ${chain.models-path}
  training:
    python-env: ${chain.python-env}

risk:
  node:
    base-path: ${chain.risk-state-path}
    ic-file: i_node_risk_state.xlsx
    ei-file: e_node_risk_state.xlsx
    future:
      ic-path: ${chain.future.ic-path}
      ei-path: ${chain.future.ei-path}
      ic-prefix: ${chain.future.ic-prefix}
      ei-prefix: ${chain.future.ei-prefix}

bailian:
  enabled: ${BAILIAN_ENABLED:true}
  api-url: ${BAILIAN_API_URL:https://dashscope.aliyuncs.com/api/v1}
  app-id: ${BAILIAN_APP_ID:92c5e69529d64e2290ef3da7c36e16fd}
  api-key: ${BAILIAN_API_KEY:sk-4c5cf49c2bd2451abd32b367fd84e980}
  response-mode: ${BAILIAN_RESPONSE_MODE:blocking}
  model: ${BAILIAN_MODEL:qwen-plus}
  connect-timeout: ${BAILIAN_CONNECT_TIMEOUT:5000}
  read-timeout: ${BAILIAN_READ_TIMEOUT:15000}

chain:
  base-path: ${CHAIN_BASE_PATH:/opt/chain}
  datasets-path: ${CHAIN_DATASETS_PATH:${chain.base-path}/datasets}
  models-path: ${CHAIN_MODELS_PATH:${chain.base-path}/models-storage}
  risk-state-path: ${CHAIN_RISK_STATE_PATH:${chain.datasets-path}/risk-state}
  future:
    ic-path: ${CHAIN_RISK_FUTURE_IC_PATH:${chain.datasets-path}/Inte}
    ei-path: ${CHAIN_RISK_FUTURE_EI_PATH:${chain.datasets-path}/Electric}
    ic-prefix: ${CHAIN_RISK_FUTURE_IC_PREFIX:集成电路}
    ei-prefix: ${CHAIN_RISK_FUTURE_EI_PREFIX:电子信息}
  python-env: ${CHAIN_PYTHON_ENV:/usr/bin/python3}
